{% extends "base.html" %}
{% block title %}Editar Entrada - T.A.N.K{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-slate-800 dark:text-white">Editar Entrada de Insumo</h1>
    <form method="POST" class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium">Data *</label>
                <input type="date" name="data_entrada" required value="{{ entrada.data_entrada.strftime('%Y-%m-%d') }}"
                       class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
            </div>
            <div>
                <label class="block text-sm font-medium">Fornecedor *</label>
                <select name="fornecedor_id" required class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
                    {% for f in fornecedores %}
                    <option value="{{ f.id }}" {% if f.id == entrada.fornecedor_id %}selected{% endif %}>{{ f.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium">Insumo *</label>
                <select name="categoria_insumo" required class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
                    <option value="DIESEL S500" {% if entrada.categoria_insumo == 'DIESEL S500' %}selected{% endif %}>Diesel S500</option>
                    <option value="DIESEL S10" {% if entrada.categoria_insumo == 'DIESEL S10' %}selected{% endif %}>Diesel S10</option>
                    <option value="GASOLINA COMUM" {% if entrada.categoria_insumo == 'GASOLINA COMUM' %}selected{% endif %}>Gasolina</option>
                    <option value="ARLA 32" {% if entrada.categoria_insumo == 'ARLA 32' %}selected{% endif %}>ARLA 32</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium">Quantidade (L) *</label>
                <input type="number" step="0.01" name="quantidade" required value="{{ entrada.quantidade }}"
                       class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
            </div>
            <div>
                <label class="block text-sm font-medium">Número NF</label>
                <input type="text" name="numero_nf" value="{{ entrada.numero_nf or '' }}"
                       class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
            </div>
            <div>
                <label class="block text-sm font-medium">Obra</label>
                <select name="obra_id" class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
                    <option value="">--</option>
                    {% for o in obras_lista %}
                    <option value="{{ o.id }}" {% if o.id == entrada.obra_id %}selected{% endif %}>{{ o.nome }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="flex justify-end gap-3">
            <a href="javascript:history.back()" class="px-4 py-2 border rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700">Cancelar</a>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-md">Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
