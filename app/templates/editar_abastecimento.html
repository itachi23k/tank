{% extends "base.html" %}
{% block title %}Editar Abastecimento - T.A.N.K{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-slate-800 dark:text-white">Editar Abastecimento</h1>
    <form method="POST" class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium">Data *</label>
                <input type="date" name="data_abastecimento" required value="{{ abast.data_abastecimento.strftime('%Y-%m-%d') }}"
                       class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
            </div>
            <div>
                <label class="block text-sm font-medium">Equipamento *</label>
                <select name="equipamento_id" required class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
                    {% for eq in equipamentos %}
                    <option value="{{ eq.id }}" {% if eq.id == abast.equipamento_id %}selected{% endif %}>{{ eq.prefixo_placa }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium">Fornecedor</label>
                <select name="fornecedor_id" class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
                    <option value="">--</option>
                    {% for f in fornecedores %}
                    <option value="{{ f.id }}" {% if f.id == abast.fornecedor_id %}selected{% endif %}>{{ f.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium">Insumo *</label>
                <select name="categoria_insumo" required class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
                    <option value="DIESEL S500" {% if abast.categoria_insumo == 'DIESEL S500' %}selected{% endif %}>Diesel S500</option>
                    <option value="DIESEL S10" {% if abast.categoria_insumo == 'DIESEL S10' %}selected{% endif %}>Diesel S10</option>
                    <option value="GASOLINA COMUM" {% if abast.categoria_insumo == 'GASOLINA COMUM' %}selected{% endif %}>Gasolina</option>
                    <option value="ARLA 32" {% if abast.categoria_insumo == 'ARLA 32' %}selected{% endif %}>ARLA 32</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium">Quantidade (L) *</label>
                <input type="number" step="0.01" name="quantidade" required value="{{ abast.quantidade }}"
                       class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
            </div>
            <div>
                <label class="block text-sm font-medium">Hodômetro (Km)</label>
                <input type="number" step="0.1" name="hodometro" value="{{ abast.hodometro or '' }}"
                       class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
            </div>
            <div>
                <label class="block text-sm font-medium">Horímetro (Hr)</label>
                <input type="number" step="0.1" name="horimetro" value="{{ abast.horimetro or '' }}"
                       class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
            </div>
            <div>
                <label class="block text-sm font-medium">Frente de Serviço</label>
                <input type="text" name="frente_servico" list="frentesSugeridas" value="{{ abast.frente_servico or '' }}" placeholder="Ex: TERRAPLENAGEM"
                       class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100 uppercase">
                <datalist id="frentesSugeridas">
                    <option value="TERRAPLENAGEM">
                    <option value="PAVIMENTAÇÃO">
                    <option value="DRENAGEM">
                    <option value="OBRAS DE ARTE ESPECIAL (OAE)">
                    <option value="ESCAVAÇÃO E CARGA">
                    <option value="CONSERVAÇÃO / MANUTENÇÃO">
                    <option value="CANTEIRO DE OBRAS">
                    <option value="TRANSPORTE DE MATERIAL">
                    <option value="APOIO OPERACIONAL">
                    <option value="OUTROS">
                </datalist>
            </div>
            <div>
                <label class="block text-sm font-medium">Obra</label>
                <select name="obra_id" class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
                    <option value="">--</option>
                    {% for o in obras_lista %}
                    <option value="{{ o.id }}" {% if o.id == abast.obra_id %}selected{% endif %}>{{ o.nome }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium">Observações</label>
            <input type="text" name="descricao_obs" value="{{ abast.descricao_obs or '' }}"
                   class="w-full px-3 py-2 border rounded-md dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
        </div>
        <div class="flex justify-end gap-3">
            <a href="javascript:history.back()" class="px-4 py-2 border rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700">Cancelar</a>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-md">Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
